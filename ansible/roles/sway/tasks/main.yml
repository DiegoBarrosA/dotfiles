---
# Sway window manager configuration role

- name: Create sway config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/sway"
    state: directory
    mode: '0755'
  tags: [sway, config]

- name: Create sway scripts directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/sway/scripts"
    state: directory
    mode: '0755'
  tags: [sway, config]

- name: Deploy sway config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/sway/config"
    dest: "{{ user_home }}/.config/sway/config"
    mode: '0644'
  tags: [sway, config]

- name: Deploy launch-or-focus script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/sway/scripts/launch-or-focus.sh"
    dest: "{{ user_home }}/.config/sway/scripts/launch-or-focus.sh"
    mode: '0755'
  tags: [sway, config]

- name: Deploy power-menu script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/sway/scripts/power-menu.sh"
    dest: "{{ user_home }}/.config/sway/scripts/power-menu.sh"
    mode: '0755'
  tags: [sway, config]

- name: Deploy clipboard-menu script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/sway/scripts/clipboard-menu.sh"
    dest: "{{ user_home }}/.config/sway/scripts/clipboard-menu.sh"
    mode: '0755'
  tags: [sway, config]

- name: Deploy screenshot-menu script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/sway/scripts/screenshot-menu.sh"
    dest: "{{ user_home }}/.config/sway/scripts/screenshot-menu.sh"
    mode: '0755'
  tags: [sway, config]

- name: Deploy lid-handler script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/sway/scripts/lid-handler.sh"
    dest: "{{ user_home }}/.config/sway/scripts/lid-handler.sh"
    mode: '0755'
  tags: [sway, config]

- name: Create kanshi config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/kanshi"
    state: directory
    mode: '0755'
  tags: [sway, config]

- name: Deploy kanshi config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/kanshi/config"
    dest: "{{ user_home }}/.config/kanshi/config"
    mode: '0644'
  tags: [sway, config]

- name: Create fontconfig directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/fontconfig"
    state: directory
    mode: '0755'
  tags: [sway, config]

- name: Deploy fontconfig
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/fontconfig/fonts.conf"
    dest: "{{ user_home }}/.config/fontconfig/fonts.conf"
    mode: '0644'
  tags: [sway, config]

- name: Create XDG environment.d directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/environment.d"
    state: directory
    mode: '0755'
  tags: [sway, config]

- name: Deploy XDG environment config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/environment.d/xdg.conf"
    dest: "{{ user_home }}/.config/environment.d/xdg.conf"
    mode: '0644'
  tags: [sway, config]

- name: Create xdg-desktop-portal config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/xdg-desktop-portal"
    state: directory
    mode: '0755'
  tags: [sway, config]

- name: Deploy portal config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/xdg-desktop-portal/portals.conf"
    dest: "{{ user_home }}/.config/xdg-desktop-portal/portals.conf"
    mode: '0644'
  tags: [sway, config]

- name: Create xdg-desktop-portal-wlr config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/xdg-desktop-portal-wlr"
    state: directory
    mode: '0755'
  tags: [sway, config]

- name: Deploy portal-wlr config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/xdg-desktop-portal-wlr/sway"
    dest: "{{ user_home }}/.config/xdg-desktop-portal-wlr/sway"
    mode: '0644'
  tags: [sway, config]

- name: Create Pictures directory for screenshots
  ansible.builtin.file:
    path: "{{ user_home }}/Pictures/Screenshots"
    state: directory
    mode: '0755'
  tags: [sway, config]

- name: Create Videos directory for recordings
  ansible.builtin.file:
    path: "{{ user_home }}/Videos"
    state: directory
    mode: '0755'
  tags: [sway, config]

- name: Deploy immersed script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/sway/scripts/immersed.sh"
    dest: "{{ user_home }}/.config/sway/scripts/immersed.sh"
    mode: '0755'
  tags: [sway, config]

- name: Create local bin directory
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    mode: '0755'
  tags: [sway, config]

- name: Download Immersed AppImage
  ansible.builtin.get_url:
    url: "{{ immersed_appimage_url | default('') }}"
    dest: "{{ user_home }}/.local/bin/Immersed-x86_64.AppImage"
    mode: '0755'
    timeout: 300
  when: immersed_appimage_url is defined and immersed_appimage_url != ''
  tags: [sway, config]
