---
# Niri Window Manager - Build and Install from Source

- name: Install build dependencies for Niri
  become: true
  ansible.builtin.apt:
    name:
      - gcc
      - clang
      - libudev-dev
      - libgbm-dev
      - libxkbcommon-dev
      - libegl1-mesa-dev
      - libwayland-dev
      - libinput-dev
      - libdbus-1-dev
      - libsystemd-dev
      - libseat-dev
      - libpipewire-0.3-dev
      - libpango1.0-dev
      - libdisplay-info-dev
    state: present
    update_cache: true
    install_recommends: false
  tags: [niri]

- name: Check if Niri is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/niri
  register: niri_installed
  tags: [niri]

- name: Clone Niri repository
  ansible.builtin.git:
    repo: "{{ niri_repo }}"
    dest: "{{ niri_build_dir }}"
    version: "{{ niri_version }}"
    force: true
  when: not niri_installed.stat.exists
  tags: [niri]

- name: Build Niri from source
  ansible.builtin.command:
    cmd: "{{ user_home }}/.cargo/bin/cargo build --release --locked"
    chdir: "{{ niri_build_dir }}"
  environment:
    PATH: "{{ user_home }}/.cargo/bin:{{ ansible_env.PATH }}"
  when: not niri_installed.stat.exists
  tags: [niri]

- name: Install Niri binary
  become: true
  ansible.builtin.copy:
    src: "{{ niri_build_dir }}/target/release/niri"
    dest: /usr/local/bin/niri
    mode: '0755'
    remote_src: true
  when: not niri_installed.stat.exists
  tags: [niri]

- name: Install Niri session script
  become: true
  ansible.builtin.copy:
    src: "{{ niri_build_dir }}/resources/niri-session"
    dest: /usr/local/bin/niri-session
    mode: '0755'
    remote_src: true
  when: not niri_installed.stat.exists
  tags: [niri]

- name: Create wayland-sessions directory
  become: true
  ansible.builtin.file:
    path: /usr/share/wayland-sessions
    state: directory
    mode: '0755'
  tags: [niri]

- name: Install Niri desktop entry
  become: true
  ansible.builtin.copy:
    src: "{{ niri_build_dir }}/resources/niri.desktop"
    dest: /usr/share/wayland-sessions/niri.desktop
    mode: '0644'
    remote_src: true
  when: not niri_installed.stat.exists
  tags: [niri]

- name: Create xdg-desktop-portal directory
  become: true
  ansible.builtin.file:
    path: /usr/share/xdg-desktop-portal
    state: directory
    mode: '0755'
  tags: [niri]

- name: Install Niri portals configuration
  become: true
  ansible.builtin.copy:
    src: "{{ niri_build_dir }}/resources/niri-portals.conf"
    dest: /usr/share/xdg-desktop-portal/niri-portals.conf
    mode: '0644'
    remote_src: true
  when: not niri_installed.stat.exists
  tags: [niri]

- name: Install Niri systemd service
  become: true
  ansible.builtin.copy:
    src: "{{ niri_build_dir }}/resources/niri.service"
    dest: /etc/systemd/user/niri.service
    mode: '0644'
    remote_src: true
  when: not niri_installed.stat.exists
  tags: [niri]

- name: Install Niri shutdown target
  become: true
  ansible.builtin.copy:
    src: "{{ niri_build_dir }}/resources/niri-shutdown.target"
    dest: /etc/systemd/user/niri-shutdown.target
    mode: '0644'
    remote_src: true
  when: not niri_installed.stat.exists
  tags: [niri]

- name: Create Niri config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/niri"
    state: directory
    mode: '0755'
  tags: [niri]

- name: Deploy Niri configuration
  ansible.builtin.template:
    src: config.kdl.j2
    dest: "{{ user_home }}/.config/niri/config.kdl"
    mode: '0644'
  tags: [niri]

- name: Clean up build directory
  ansible.builtin.file:
    path: "{{ niri_build_dir }}"
    state: absent
  when: not niri_installed.stat.exists
  tags: [niri]

- name: Display Niri installation notice
  ansible.builtin.debug:
    msg: |
      Niri has been installed successfully!
      
      To use Niri:
      1. Log out of your current session
      2. Select 'Niri' from the session menu in your login manager
      3. Or run 'niri-session' from a TTY
      
      Configuration file: {{ user_home }}/.config/niri/config.kdl
  tags: [niri]
