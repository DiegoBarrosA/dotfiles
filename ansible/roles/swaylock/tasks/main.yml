---
# Swaylock-effects - Build from Source

- name: Remove native swaylock if installed
  become: true
  ansible.builtin.apt:
    name: swaylock
    state: absent
    purge: true
  tags: [swaylock]

- name: Install swaylock-effects build dependencies
  become: true
  ansible.builtin.apt:
    name:
      - meson
      - ninja-build
      - git
      - scdoc
      - libwayland-dev
      - wayland-protocols
      - libcairo2-dev
      - libgdk-pixbuf-2.0-dev
      - libpam0g-dev
      - libxkbcommon-dev
      - libomp-dev
    state: present
    update_cache: true
    install_recommends: false
  tags: [swaylock]

- name: Check if swaylock-effects is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/swaylock
  register: swaylock_installed
  tags: [swaylock]

- name: Clone swaylock-effects repository
  ansible.builtin.git:
    repo: "https://github.com/mortie/swaylock-effects.git"
    dest: /tmp/swaylock-effects
    version: master
    force: true
  when: not swaylock_installed.stat.exists
  tags: [swaylock]

- name: Configure swaylock-effects build with meson
  ansible.builtin.command:
    cmd: meson setup build -Dpam=enabled -Dgdk-pixbuf=enabled
    chdir: /tmp/swaylock-effects
  when: not swaylock_installed.stat.exists
  tags: [swaylock]

- name: Build swaylock-effects with ninja
  ansible.builtin.command:
    cmd: ninja -C build
    chdir: /tmp/swaylock-effects
  when: not swaylock_installed.stat.exists
  tags: [swaylock]

- name: Install swaylock-effects
  become: true
  ansible.builtin.command:
    cmd: ninja -C build install
    chdir: /tmp/swaylock-effects
  when: not swaylock_installed.stat.exists
  tags: [swaylock]

- name: Clean up build directory
  ansible.builtin.file:
    path: /tmp/swaylock-effects
    state: absent
  when: not swaylock_installed.stat.exists
  tags: [swaylock]

- name: Create swaylock config directory
  ansible.builtin.file:
    path: "{{ user_home }}/.config/swaylock"
    state: directory
    mode: '0755'
  tags: [swaylock, config]

- name: Deploy swaylock-effects config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/swaylock/config"
    dest: "{{ user_home }}/.config/swaylock/config"
    mode: '0644'
  tags: [swaylock, config]

- name: Display swaylock-effects installation notice
  ansible.builtin.debug:
    msg: |
      Swaylock-effects has been compiled and installed from source!
      
      Binary location: /usr/local/bin/swaylock
      Config location: {{ user_home }}/.config/swaylock/config
      
      Features enabled:
      - Screenshots with blur effect
      - Clock display
      - Fade-in animation
      - Vignette effect
      - Greyscale filter
  tags: [swaylock]
