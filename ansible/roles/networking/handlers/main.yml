---
# Networking role handlers

- name: Apply netplan
  become: true
  ansible.builtin.command:
    cmd: netplan apply
  changed_when: true

- name: Restart systemd-resolved
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

- name: Restart NetworkManager
  become: true
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted
