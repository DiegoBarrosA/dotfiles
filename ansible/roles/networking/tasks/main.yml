---
# Networking role - Configure NetworkManager for desktop use
# Disables systemd-networkd to avoid conflicts and slow boot times

- name: Install NetworkManager and related packages
  become: true
  ansible.builtin.apt:
    name:
      - network-manager
      - network-manager-gnome
    state: present
    install_recommends: false
  tags: [networking, packages]

- name: Disable systemd-networkd services (using NetworkManager instead)
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - systemd-networkd.service
    - systemd-networkd.socket
    - systemd-networkd-wait-online.service
  ignore_errors: true
  tags: [networking, config]

- name: Ensure NetworkManager is enabled and running
  become: true
  ansible.builtin.systemd:
    name: NetworkManager
    enabled: true
    state: started
  tags: [networking, config]

- name: Disable NetworkManager-wait-online to speed up boot
  become: true
  ansible.builtin.systemd:
    name: NetworkManager-wait-online.service
    enabled: false
  tags: [networking, config]

- name: Configure netplan to use NetworkManager as renderer
  become: true
  ansible.builtin.copy:
    dest: /etc/netplan/01-network-manager-all.yaml
    content: |
      # Let NetworkManager manage all devices
      network:
        version: 2
        renderer: NetworkManager
    mode: '0600'
  notify: Apply netplan
  tags: [networking, config]

# --- Multi-VPN Split-Horizon DNS Configuration ---
- name: Create systemd-resolved config directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: '0755'
  tags: [networking, dns]

- name: Configure systemd-resolved for split-horizon DNS
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/dns.conf
    content: |
      # Multi-VPN DNS configuration
      # Each VPN gets its own routing domain automatically
      [Resolve]
      DNS=1.1.1.1 9.9.9.9
      FallbackDNS=8.8.8.8 8.8.4.4
      DNSStubListener=yes
      MulticastDNS=no
      LLMNR=no
      Cache=yes
    mode: '0644'
  notify: Restart systemd-resolved
  tags: [networking, dns]

- name: Configure NetworkManager to use systemd-resolved
  become: true
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/dns.conf
    content: |
      # Use systemd-resolved for DNS
      [main]
      dns=systemd-resolved
      systemd-resolved=true
    mode: '0644'
  notify: Restart NetworkManager
  tags: [networking, dns]

- name: Ensure resolv.conf symlink points to systemd-resolved
  become: true
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: yes
  tags: [networking, dns]

- name: Enable systemd-resolved service
  become: true
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: true
    state: started
  tags: [networking, dns]

- name: Display networking configuration info
  ansible.builtin.debug:
    msg: |
      Networking configured for multi-VPN support:
      
      - NetworkManager: Primary network manager
      - systemd-resolved: DNS with split-horizon support
      - Fallback DNS: 1.1.1.1, 9.9.9.9
      
      VPN routing:
      - Each VPN connection automatically gets its own DNS routing
      - Tailscale: Uses MagicDNS for *.ts.net domains
      - Work VPNs: Configure routing domains in VPN settings
      
      Check DNS routing: resolvectl status
      Debug queries: resolvectl query example.com
  tags: [networking]
