---
# Package installation role

# Remove snap packages and snapd
- name: Remove all snap packages (iteratively to handle dependencies)
  become: true
  ansible.builtin.shell: |
    set -e
    max_attempts=10
    attempt=0
    while snap list 2>/dev/null | grep -v "^Name" | grep -q .; do
      attempt=$((attempt + 1))
      if [ $attempt -gt $max_attempts ]; then
        echo "Max attempts reached, some snaps may remain"
        exit 0
      fi
      for snap in $(snap list 2>/dev/null | awk 'NR>1 {print $1}'); do
        snap remove --purge "$snap" 2>/dev/null || true
      done
    done
    echo "All snaps removed"
  args:
    executable: /bin/bash
  register: snap_removal
  changed_when: "'All snaps removed' in snap_removal.stdout"
  failed_when: false
  tags: [packages, snap]

- name: Stop and disable snapd services
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - snapd.service
    - snapd.socket
    - snapd.seeded.service
  ignore_errors: true
  tags: [packages, snap]

- name: Remove snapd package
  become: true
  ansible.builtin.apt:
    name: snapd
    state: absent
    purge: true
  tags: [packages, snap]

- name: Remove snap directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /snap
    - /var/snap
    - /var/lib/snapd
    - /var/cache/snapd
    - "{{ user_home }}/snap"
  tags: [packages, snap]

- name: Prevent snapd from being reinstalled
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nosnap.pref
    content: |
      Package: snapd
      Pin: release a=*
      Pin-Priority: -10
    mode: '0644'
  tags: [packages, snap]

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [packages]

- name: Install essential utilities
  become: true
  ansible.builtin.apt:
    name:
      - zip
      - unzip
      - xdg-user-dirs
    state: present
    install_recommends: false
  tags: [packages]

- name: Update XDG user directories
  ansible.builtin.command:
    cmd: xdg-user-dirs-update
  changed_when: false
  tags: [packages]

- name: Install Sway and Wayland essentials
  become: true
  ansible.builtin.apt:
    name:
      - sway
      - swayidle
      - swaybg
      - wl-clipboard
      - xdg-desktop-portal-wlr
      - xdg-desktop-portal-gtk
      - xwayland
    state: present
    install_recommends: false
  tags: [packages]

# Note: swaylock-effects is built from source via the swaylock role

- name: Install application launcher and notifications
  become: true
  ansible.builtin.apt:
    name:
      - fuzzel
      - mako-notifier
    state: present
    install_recommends: false
  tags: [packages]

# Note: Terminal (Alacritty) is installed via the alacritty role

- name: Install file manager
  become: true
  ansible.builtin.apt:
    name:
      - pcmanfm
    state: present
    install_recommends: false
  tags: [packages]

- name: Create local applications directory for desktop overrides
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/applications"
    state: directory
    mode: '0755'
  tags: [packages]

- name: Hide PCManFM Desktop Preferences entry (doesn't work in Sway)
  ansible.builtin.copy:
    dest: "{{ user_home }}/.local/share/applications/pcmanfm-desktop-pref.desktop"
    mode: '0644'
    content: |
      [Desktop Entry]
      Type=Application
      NoDisplay=true
  tags: [packages]

- name: Install screenshot and screen recording tools
  become: true
  ansible.builtin.apt:
    name:
      - grim
      - slurp
      - wf-recorder
    state: present
    install_recommends: false
  tags: [packages]

- name: Install audio/video utilities
  become: true
  ansible.builtin.apt:
    name:
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - pipewire-jack
      - wireplumber
      - pavucontrol
      - playerctl
      - easyeffects
    state: present
    install_recommends: false
  tags: [packages, audio]

- name: Install brightness control
  become: true
  ansible.builtin.apt:
    name:
      - light
    state: present
    install_recommends: false
  tags: [packages]

- name: Install power management
  become: true
  ansible.builtin.apt:
    name:
      - power-profiles-daemon
    state: present
    install_recommends: false
  tags: [packages]

- name: Enable power-profiles-daemon service
  become: true
  ansible.builtin.systemd:
    name: power-profiles-daemon
    enabled: true
    state: started
  tags: [packages]

# Tailscale VPN
- name: Add Tailscale GPG key
  become: true
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
  tags: [packages, tailscale]

- name: Add Tailscale repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main"
    filename: tailscale
    state: present
  tags: [packages, tailscale]

- name: Install Tailscale
  become: true
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
    install_recommends: false
  tags: [packages, tailscale]

- name: Enable Tailscale service
  become: true
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  tags: [packages, tailscale]

- name: Install utility packages
  become: true
  ansible.builtin.apt:
    name:
      - dconf-cli
      - gsettings-desktop-schemas
    state: present
    install_recommends: false
  tags: [packages]

- name: Install build dependencies for cargo packages
  become: true
  ansible.builtin.apt:
    name:
      - build-essential
      - pkg-config
      - libssl-dev
      - libdbus-1-dev
    state: present
    install_recommends: false
  tags: [packages]

- name: Install GTK theming packages
  become: true
  ansible.builtin.apt:
    name:
      - gnome-themes-extra
      - adwaita-icon-theme
      - papirus-icon-theme
    state: present
    install_recommends: false
  tags: [packages]

- name: Add user to video group (for brightness control)
  become: true
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: video
    append: true
  tags: [packages]

# Note: CLI tools (swayr, autotiling-rs, jq, etc.) are now managed by Nix home-manager
# See ~/nix-config for CLI tool configuration

# --- Bluetooth ---
- name: Install Bluetooth packages
  become: true
  ansible.builtin.apt:
    name:
      - bluez
      - bluez-tools
      - blueman
    state: present
    install_recommends: false
  tags: [packages, bluetooth]

- name: Enable Bluetooth service
  become: true
  ansible.builtin.systemd:
    name: bluetooth
    enabled: true
    state: started
  ignore_errors: true
  tags: [packages, bluetooth]

- name: Add user to bluetooth group
  become: true
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: bluetooth
    append: true
  ignore_errors: true
  tags: [packages, bluetooth]

# --- Display Management ---
- name: Install display management tools
  become: true
  ansible.builtin.apt:
    name:
      - kanshi
      - wdisplays
      - wlr-randr
    state: present
    install_recommends: false
  tags: [packages, display]

# --- Desktop Viewers (GPU accelerated) ---
- name: Install media viewers
  become: true
  ansible.builtin.apt:
    name:
      - mpv
      - imv
      - zathura
      - zathura-pdf-poppler
    state: present
    install_recommends: false
  tags: [packages, viewers]

# --- GPU Acceleration ---
- name: Install GPU acceleration packages
  become: true
  ansible.builtin.apt:
    name:
      - mesa-vulkan-drivers
      - libva-mesa-driver
      - vdpau-driver-all
      - vainfo
      - vulkan-tools
    state: present
    install_recommends: false
  tags: [packages, gpu]

- name: Check if CPU is Intel for media driver
  ansible.builtin.set_fact:
    is_intel: "{{ 'Intel' in ansible_processor | join(' ') }}"
  tags: [packages, gpu]

- name: Install Intel media driver
  become: true
  ansible.builtin.apt:
    name: intel-media-va-driver-non-free
    state: present
    install_recommends: false
  when: is_intel
  ignore_errors: true
  tags: [packages, gpu]

# --- File Manager Enhancements ---
- name: Install file manager support packages
  become: true
  ansible.builtin.apt:
    name:
      - gvfs
      - gvfs-backends
      - tumbler
      - file-roller
    state: present
    install_recommends: false
  tags: [packages, file-manager]

# --- Blue Light Filter ---
- name: Install wlsunset for blue light filtering
  become: true
  ansible.builtin.apt:
    name: wlsunset
    state: present
    install_recommends: false
  tags: [packages]

# --- Polkit Agent ---
- name: Install polkit agent
  become: true
  ansible.builtin.apt:
    name: policykit-1-gnome
    state: present
    install_recommends: false
  tags: [packages]

# --- Touchpad Gestures ---
- name: Install libinput tools for gestures
  become: true
  ansible.builtin.apt:
    name: libinput-tools
    state: present
    install_recommends: false
  tags: [packages]

- name: Add user to input group (for gestures)
  become: true
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: input
    append: true
  tags: [packages]

# --- Cleanup ---
- name: Remove automatically installed packages that are no longer needed
  become: true
  ansible.builtin.apt:
    autoremove: true
    purge: true
  tags: [packages, cleanup]
