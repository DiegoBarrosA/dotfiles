---
# Ghostty terminal emulator installation role

- name: Check if Ghostty is already installed
  ansible.builtin.stat:
    path: "/usr/bin/ghostty"
  register: ghostty_binary
  tags: [ghostty]

- name: Install Ghostty from ghostty-ubuntu repository
  when: not ghostty_binary.stat.exists
  become: true
  ansible.builtin.shell:
    cmd: /bin/bash -c "$(curl -fsSL {{ ghostty_ubuntu_install_script }})"
    creates: /usr/bin/ghostty
  tags: [ghostty]

- name: Deploy Ghostty configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/ghostty/config"
    dest: "{{ user_home }}/.config/ghostty/config"
    mode: '0644'
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  tags: [ghostty, config]

- name: Set TERMINAL environment variable in profile
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.profile"
    regexp: '^export TERMINAL='
    line: 'export TERMINAL=ghostty'
    create: true
    mode: '0644'
  tags: [ghostty, config]
