---
# Docker Engine installation (headless)

- name: Install dependencies for Docker repository
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    install_recommends: false
  tags: [docker]

- name: Create directory for apt keyrings
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: [docker]

- name: Add Docker GPG key
  become: true
  ansible.builtin.shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  tags: [docker]

- name: Add Docker repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  tags: [docker]

- name: Install Docker Engine
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    install_recommends: false
  tags: [docker]

- name: Ensure Docker service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  tags: [docker]

- name: Ensure docker group exists
  become: true
  ansible.builtin.group:
    name: docker
    state: present
  tags: [docker]

- name: Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: docker
    append: true
  tags: [docker]

- name: Display docker group notice
  ansible.builtin.debug:
    msg: |
      User {{ user_name }} has been added to the docker group.
      You will need to log out and back in for this to take effect.
      Alternatively, run: newgrp docker
  tags: [docker]
