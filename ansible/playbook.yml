---
# Dotfiles Deployment Playbook
# Deploys a Sway-based desktop environment on Ubuntu
# Integrates with Nix home-manager for CLI tools

- name: Deploy desktop environment
  hosts: localhost
  gather_facts: true
  
  vars:
    config_dir: "{{ playbook_dir }}/../configs"
    theme: "{{ lookup('file', playbook_dir + '/../themes/material-darker.yml') | from_yaml }}"
    
  tasks:
    - name: Ensure we're running on a supported system
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: "This playbook is designed for Debian/Ubuntu systems"
      tags: [always]

  roles:
    # System packages and base setup
    - role: packages
      tags: [packages]
    - role: system-optimization
      tags: [optimization]
    - role: networking
      tags: [networking]
    
    # Nix and CLI tools
    - role: nix
      tags: [nix]
    
    # Cursor and theming
    - role: bibata-cursor
      tags: [bibata-cursor, cursor]
    - role: cursor
      tags: [cursor]
    
    # Container and development
    - role: docker
      tags: [docker]
    
    # Desktop environment builds
    - role: waybar-build
      tags: [waybar-build, waybar]
    - role: niri
      tags: [niri]
    
    # Fonts and theming
    - role: fonts
      tags: [fonts, config]
    - role: gtk
      tags: [gtk, config]
    
    # Window manager and bar
    - role: sway
      tags: [sway, config]
    - role: waybar
      tags: [waybar, config]
    
    # Terminal (Alacritty daemon-client)
    - role: alacritty
      tags: [alacritty, terminal, config]
    
    # Notifications and launcher
    - role: mako
      tags: [mako, config]
    - role: fuzzel
      tags: [fuzzel, config]
    
    # Screen lock
    - role: swaylock
      tags: [swaylock, config]
    
    # Applications (Flatpak)
    - role: flatpaks
      tags: [flatpaks]
    - role: firefox
      tags: [firefox, browser, config]
    
    # Display manager
    - role: greetd
      tags: [greetd, config]

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          Desktop environment deployed successfully!
          
          Key changes:
          - Terminal: Alacritty (daemon-client mode for lower memory)
          - Browser: Firefox (Flatpak with Cascade theme)
          - CLI tools: Managed by Nix home-manager
          - System: Optimized with zram, sysctl tuning
          - VPN: Multi-VPN support with split-horizon DNS
          
          New keybinds:
          - $mod+v: Clipboard history
          - $mod+Shift+n: Network manager (nmtui)
          - $mod+Shift+b: Bluetooth manager
          - $mod+Shift+d: Display settings
          - $mod+Print: Screenshot menu
          - $mod+Shift+r: Screen recording
          
          To start using sway:
          1. Log out of your current session
          2. Select 'Sway' from tuigreet
          3. Or run 'sway' from a TTY
          
          CLI tools (via Nix): fish, zellij, helix, bat, bottom, yazi, etc.
          Run: cd ~/nix-config && home-manager switch --flake .#rubi
      tags: [always]
